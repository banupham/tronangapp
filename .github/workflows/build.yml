name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/tronangapp-signing.p12"

      - name: Check PC control tools
        run: python -m py_compile tools/ws_server.py tools/ws_gui.py

      - name: Build debug APK
        env:
          TRONANGAPP_KEYSTORE_FILE: ${{ runner.temp }}/tronangapp-signing.p12
          TRONANGAPP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TRONANGAPP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TRONANGAPP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - name: Verify persistent APK signature
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          CERTS="$($APKSIGNER verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$CERTS"
          printf '%s\n' "$CERTS" | grep -Fq 'certificate SHA-256 digest: 8a71cb90446db1157d4112dd6c13a8ef710b4ba40b470937befea9543429ea6b'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tronangapp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
